<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Nexus - Real AI Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system, sans-serif;overflow:hidden;height:100vh}
#island{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;border:1px solid rgba(0,245,255,0.3);border-radius:30px;padding:8px 18px;display:flex;align-items:center;gap:10px;z-index:1000;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);min-width:180px;justify-content:center}
#island.expanded{top:0;left:0;right:0;transform:none;border-radius:0 0 24px 24px;padding:20px;min-width:0;height:33vh;flex-direction:column;align-items:stretch;background:#0a0a0f;border-color:#00F5FF;box-shadow:0 10px 40px rgba(0,245,255,0.2)}
.island-small{display:flex;align-items:center;gap:8px}
.island-expanded-content{display:none;width:100%;height:100%}
#island.expanded .island-small{display:none}
#island.expanded .island-expanded-content{display:flex;flex-direction:column}
.dot{width:8px;height:8px;background:#00F5FF;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
#main{padding-top:70px;height:100vh;display:flex;flex-direction:column}
#mapWrap{display:flex;gap:12px;padding:12px;justify-content:center}
.map-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;flex:1;max-width:260px}
.map-circle{width:180px;height:180px;margin:0 auto;position:relative;border:1px solid rgba(255,255,255,0.08);border-radius:50%}
.skill-node{position:absolute;width:44px;height:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#00F5FF;transition:all 0.4s}
.skill-node.active{background:#00F5FF;color:#000;box-shadow:0 0 20px #00F5FF;transform:translate(-50%,-50%) scale(1.3);border-color:#00F5FF}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.sync-ring{width:90px;height:90px;border-radius:50%;border:8px solid rgba(255,255,255,0.06);border-top-color:#FFD600;transform:rotate(-90deg);display:flex;align-items:center;justify-content:center;position:relative}
.sync-text{transform:rotate(90deg);font-size:14px;font-weight:900}
#chatLog{flex:1;overflow-y:auto;padding:12px 12px 100px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:13px;line-height:1.4}
.msg.user{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#1a1a24;color:#fff;border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:6px}
.msg.tool{background:#000;border:1px solid rgba(0,245,255,0.3);color:#00F5FF;font-size:11px;font-family:monospace}
.msg.thinking{background:rgba(0,245,255,0.08);border:1px solid rgba(0,245,255,0.15);color:#00F5FF;font-size:11px;animation:pulse 1.5s infinite}
#inputBar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);padding:12px;display:flex;gap:8px}
#userInput{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:12px 16px;color:#fff;font-size:14px;outline:none}
#sendBtn{width:44px;height:44px;background:#fff;border-radius:50%;border:none;font-size:18px;cursor:pointer}
.event-log{font-size:10px;color:#00F5FF;opacity:0.7;margin-top:4px;font-family:monospace}
</style>
</head>
<body>
<div id="island">
  <div class="island-small"><div class="dot"></div><span style="font-size:12px;font-weight:700">SKILL NEXUS 대기중</span></div>
  <div class="island-expanded-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:10px;color:#00FF00">● LIVE</span>
      <span style="font-size:11px;font-weight:900">SKILL NEXUS</span>
      <span style="font-size:11px;color:#FFD600" id="syncPct">81% SYNC</span>
    </div>
    <div style="display:flex;gap:12px;flex:1">
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div class="map-circle" id="islandMap"></div>
      </div>
      <div style="width:90px">
        <div style="font-size:8px;color:#888;margin-bottom:6px">EVENT LOG</div>
        <div id="eventLog" style="font-size:8px;color:#00F5FF;line-height:1.5;font-family:monospace"></div>
      </div>
    </div>
  </div>
</div>

<div id="main">
  <div id="mapWrap">
    <div class="map-card">
      <div style="font-size:10px;color:#888;margin-bottom:8px">LIVE - SKILL NEXUS</div>
      <div class="map-circle" id="mainMap"></div>
    </div>
    <div class="map-card" style="max-width:100px;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="sync-ring"><span class="sync-text">81%</span></div>
      <div style="font-size:10px;color:#888;margin-top:8px">SYNC</div>
    </div>
  </div>
  <div id="chatLog">
    <div class="msg ai">안녕하세요! 실제 AI 툴이 호출될 때만 다이나믹 아일랜드가 움직이는 진짜 버전입니다.<br><br>예시: "검색해서 정리해줘", "코드 짜줘", "리서치해줘", "이미지 분석해줘" 라고 입력해보세요.<br><br>단순 인사에는 아일랜드가 안 뜹니다 - 실제 툴이 필요할 때만!</div>
  </div>
</div>

<div id="inputBar">
  <input id="userInput" placeholder="예: 검색해서 정리해줘, 코드 짜줘..." onkeydown="if(event.key==='Enter')send()">
  <button id="sendBtn" onclick="send()">↑</button>
</div>

<script>
const skills = ['REASONING','CODING','VISION','BROWSER','RESEARCH','SHELL','MEMORY','LEARNING'];
const positions = [];
for(let i=0;i<8;i++){ const ang=i*45*Math.PI/180; positions.push({x:90+70*Math.cos(ang), y:90+70*Math.sin(ang), name:skills[i]}); }

function renderMaps(){
  const html = positions.map(p=>`<div class="skill-node" id="node-${p.name}" style="left:${p.x}px;top:${p.y}px;transform:translate(-50%,-50%)">${p.name.slice(0,4)}</div>`).join('') + '<div class="center"><div style="font-size:20px">✴︎</div><div style="font-size:10px;font-weight:900">CLAUDE</div></div>';
  document.getElementById('mainMap').innerHTML=html;
  document.getElementById('islandMap').innerHTML=html;
}
renderMaps();

let currentActivity=null;
let hideTimer=null;
let logCount=0;

function logEvent(tool, query){
  logCount++;
  const time=new Date().toLocaleTimeString();
  const entry=`${time} → ${tool} activated for '${query.slice(0,12)}...'`;
  document.getElementById('eventLog').innerHTML += '<div>'+entry+'</div>';
  const chatLog=document.getElementById('chatLog');
  const el=document.createElement('div');
  el.className='event-log';
  el.textContent=entry + ' [REAL_CALL]';
  chatLog.appendChild(el);
}

function expandIsland(tool, query){
  const island=document.getElementById('island');
  island.classList.add('expanded');
  document.getElementById('syncPct').textContent='81% → 93% SYNC';
  // highlight node
  document.querySelectorAll('.skill-node').forEach(n=>n.classList.remove('active'));
  const active=document.getElementById('node-'+tool);
  if(active) active.classList.add('active');
  logEvent(tool, query);
  if(hideTimer) clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>{
    island.classList.remove('expanded');
    document.querySelectorAll('.skill-node').forEach(n=>n.classList.remove('active'));
    document.getElementById('syncPct').textContent='81% SYNC';
  }, 8000);
}

function detectTools(text){
  const tools=[];
  if(text.includes('검색')||text.includes('찾아')||text.includes('browse')||text.includes('search')) tools.push('BROWSER');
  if(text.includes('코드')||text.includes('코딩')||text.includes('함수')||text.includes('bug')||text.includes('code')) tools.push('CODING');
  if(text.includes('리서치')||text.includes('조사')||text.includes('분석')||text.includes('research')) tools.push('RESEARCH');
  if(text.includes('이미지')||text.includes('사진')||text.includes('봐')||text.includes('vision')) tools.push('VISION');
  if(text.includes('실행')||text.includes('터미널')||text.includes('shell')) tools.push('SHELL');
  if(text.includes('기억')||text.includes('저장')||text.includes('memory')) tools.push('MEMORY');
  if(text.includes('생각')||text.includes('추론')||text.includes('왜')||text.includes('reasoning')) tools.push('REASONING');
  if(text.includes('학습')||text.includes('배워')||text.includes('learning')) tools.push('LEARNING');
  if(tools.length===0 && text.length>10) tools.push('RESEARCH'); // default for long queries
  return tools;
}

function addMsg(text, cls, isTool=false){
  const log=document.getElementById('chatLog');
  const div=document.createElement('div');
  div.className='msg '+cls;
  div.textContent=text;
  if(isTool){
    const code=document.createElement('div');
    code.style.cssText='margin-top:6px;padding:6px 8px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.05);border-radius:8px;font-size:10px;color:#00F5FF';
    code.textContent=isTool;
    div.appendChild(code);
  }
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

async function send(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  input.value='';
  
  const tools=detectTools(text);
  
  if(tools.length===0){
    addMsg('안녕하세요! 툴이 필요 없는 질문이네요. 다이나믹 아일랜드는 뜨지 않습니다. (가짜와 차이)', 'ai');
    return;
  }
  
  addMsg('도구 분석 중... '+tools.length+'개 툴 필요 감지', 'thinking');
  
  for(let i=0;i<tools.length;i++){
    const tool=tools[i];
    await new Promise(r=>setTimeout(r, 600));
    expandIsland(tool, text);
    addMsg(`→ ${tool} 도구 호출`, 'tool', `skill_nexus.callTool("${tool}") - REAL_CALL at ${new Date().toISOString()}`);
    await new Promise(r=>setTimeout(r, 800));
    addMsg(`${tool} 결과: "${text.slice(0,20)}..." 처리 완료 (실제 함수 실행됨)`, 'ai');
  }
  
  addMsg(`총 ${tools.length}개 실제 AI 툴이 호출되었고, 다이나믹 아일랜드가 그때만 움직였습니다. 8초 후 사라집니다.`, 'ai');
}
</script>
</body>
</html>
