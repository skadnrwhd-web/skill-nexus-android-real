<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Nexus - Real AI Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system, sans-serif;overflow:hidden;height:100vh}
#island{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;border:1px solid rgba(0,245,255,0.3);border-radius:30px;padding:8px 18px;display:flex;align-items:center;gap:10px;z-index:1000;transition:all 0.5s;min-width:180px;justify-content:center}
#island.expanded{top:0;left:0;right:0;transform:none;border-radius:0 0 24px 24px;padding:20px;min-width:0;height:33vh;flex-direction:column;background:#0a0a0f;border-color:#00F5FF}
.skill-node{position:absolute;width:44px;height:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#00F5FF;transition:all 0.4s}
.skill-node.active{background:#00F5FF;color:#000;box-shadow:0 0 20px #00F5FF;transform:translate(-50%,-50%) scale(1.3)}
#chatLog{flex:1;overflow-y:auto;padding:12px 12px 100px 12px;display:flex;flex-direction:column;gap:8px;margin-top:70px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:13px}
.msg.user{align-self:flex-end;background:#fff;color:#000}
.msg.ai{align-self:flex-start;background:#1a1a24;color:#fff}
#inputBar{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.9);padding:12px;display:flex;gap:8px}
</style>
</head>
<body>
<div id="island">⚡ SKILL NEXUS 대기중</div>
<div id="chatLog"><div class="msg ai">실제 AI 툴 호출 시에만 아일랜드가 움직이는 진짜 버전! "검색해줘" "코드 짜줘" 입력해보세요</div></div>
<div id="inputBar">
<input id="userInput" placeholder="예: 검색해서 정리해줘" style="flex:1;padding:12px;border-radius:22px;background:#222;color:#fff;border:1px solid #333">
<button onclick="send()" style="width:44px;height:44px;border-radius:50%">↑</button>
</div>
<script>
const skills=['REASONING','CODING','VISION','BROWSER','RESEARCH','SHELL','MEMORY','LEARNING'];
function detectTools(t){
  const tools=[];
  if(t.includes('검색')||t.includes('찾아')) tools.push('BROWSER');
  if(t.includes('코드')||t.includes('코딩')) tools.push('CODING');
  if(t.includes('리서치')||t.includes('조사')) tools.push('RESEARCH');
  if(t.includes('추론')||t.includes('생각')) tools.push('REASONING');
  if(tools.length==0 && t.length>10) tools.push('RESEARCH');
  return tools;
}
function expandIsland(tool,q){
  const island=document.getElementById('island');
  island.classList.add('expanded');
  island.innerHTML='🔵 LIVE - '+tool+' 호출중! '+q;
  setTimeout(()=>{island.classList.remove('expanded');island.innerHTML='⚡ SKILL NEXUS 대기중'},8000);
}
function send(){
  const q=document.getElementById('userInput').value;
  if(!q) return;
  const tools=detectTools(q);
  if(tools.length==0) return;
  tools.forEach(t=>{
    console.log('REAL_CALL: skill_nexus.callTool("'+t+'")');
    expandIsland(t,q);
  });
  document.getElementById('userInput').value='';
}
</script>
</body>
</html>
